name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: unit tests + taxonomy governance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Taxonomy governance checks
        run: npm run validate

  report:
    # Bot-dispatched runs email nobody. A timeout and a superseded run both conclude cancelled.
    needs: test
    if: ${{ always() && github.ref_name == github.event.repository.default_branch && (needs.test.result == 'failure' || needs.test.result == 'cancelled') }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
      actions: read
    steps:
      - name: Report the failure on the open P1 issue, or open one
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          # cancel-in-progress cancels a run once a newer one starts; only a cancelled newest run hung.
          if [ "$TEST_RESULT" = cancelled ]; then
            NEWEST=$(gh run list --workflow ci.yml --branch "$GITHUB_REF_NAME" --limit 1 --json databaseId --jq '.[0].databaseId' || true)
            if [ -n "$NEWEST" ] && [ "$NEWEST" != "$GITHUB_RUN_ID" ]; then
              echo "Superseded by run $NEWEST, not an outage."
              exit 0
            fi
          fi
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          OPEN=$(gh issue list --state open --search 'in:title "P1: CI failed on master"' --json number --jq '.[0].number // empty' || true)
          if [ -n "$OPEN" ]; then
            gh issue comment "$OPEN" --body "@$GITHUB_REPOSITORY_OWNER failed again on $(date -u +%Y-%m-%d). Run: $RUN_URL"
          else
            gh issue create \
              --title "P1: CI failed on master" \
              --body "@$GITHUB_REPOSITORY_OWNER tests or taxonomy checks fail on master, often on data the crawl just committed. Run: $RUN_URL"
          fi
