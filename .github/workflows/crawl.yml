name: crawl

on:
  schedule:
    # Daily at 06:37 UTC. This is the primary schedule: it runs whether or not the maintainer's
    # machine is on, and each run stops on its own budget and resumes the next day. The local
    # timer from ops/install-schedule.sh is optional. Off the hour on purpose: schedule events at
    # :00 are dropped under load, and the commit below is the repository activity that keeps this
    # schedule from being auto-disabled after 60 days (spec §6.5).
    - cron: '37 6 * * *'
  workflow_dispatch:
    inputs:
      allowlist:
        description: 'Comma-separated owner/repo list. Leave empty for a full discovery crawl.'
        required: false
        default: ''

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run the harvest
        id: harvest
        env:
          # GITHUB_TOKEN is repo-scoped and cannot perform global search (spec §6.2).
          CATALOG_PAT: ${{ secrets.CATALOG_PAT }}
          ALLOWLIST: ${{ inputs.allowlist }}
          # Stop cleanly before timeout-minutes, leaving room for the largest repo and the commit.
          HARVEST_TIME_BUDGET_MIN: '35'
        run: |
          if [ -z "$CATALOG_PAT" ]; then
            echo "::error::CATALOG_PAT is unset or expired. A fine-grained PAT with public-repo read is mandatory; GITHUB_TOKEN cannot perform global search."
            exit 1
          fi
          # A failed repo must not block committing the rest: record the exit, fail the job later.
          set +e
          if [ -n "$ALLOWLIST" ]; then
            node scripts/harvest/run.ts --allowlist="$ALLOWLIST"
          else
            node scripts/harvest/run.ts
          fi
          echo "exit=$?" >> "$GITHUB_OUTPUT"

      - name: Rebuild the rescue index from the refreshed catalog
        run: node scripts/build-rescue-index.ts

      - name: Commit the refreshed catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/skills.json data/collections.json data/meta.json public/rescue-index
          git commit --allow-empty -m "chore(crawl): refresh catalog data $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --autostash origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"

      - name: Publish the refreshed catalog
        # A push made with GITHUB_TOKEN starts no workflow, so deploy and CI are dispatched.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run deploy.yml --ref "$GITHUB_REF_NAME"
          gh workflow run ci.yml --ref "$GITHUB_REF_NAME"

      - name: Fail the job when the harvest failed
        if: steps.harvest.outputs.exit != '0'
        env:
          HARVEST_EXIT: ${{ steps.harvest.outputs.exit }}
        run: |
          echo "::error::The harvest exited $HARVEST_EXIT. What it wrote is committed; the log above names what failed."
          exit 1

      - name: Report the failure on the open P1 issue, or open one
        # A timeout concludes `cancelled`, not `failure`: without cancelled() it would be silent.
        if: failure() || cancelled()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          OPEN=$(gh issue list --state open --search 'in:title "P1: crawl failed"' --json number --jq '.[0].number // empty' || true)
          if [ -n "$OPEN" ]; then
            gh issue comment "$OPEN" --body "Failed again on $(date -u +%Y-%m-%d): $RUN_URL"
          else
            gh issue create \
              --title "P1: crawl failed" \
              --body "The daily harvest failed, so the catalog is going stale. A silent crawler is a P1 bug, not a maintenance chore (spec §13). Run: $RUN_URL"
          fi
