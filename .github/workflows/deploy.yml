# One-time manual setup: repository Settings -> Pages -> Source: GitHub Actions.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Builds take minutes; GitHub's 6 h default hid a hang for two days (2026-10-11).
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Configure Pages
        uses: actions/configure-pages@v6.0.0
      - name: Build the site
        run: npm run build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: ./dist
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Above Pages' own 10-minute deploy timeout, so the action reports first.
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.0

  report:
    # A broken deploy freezes the site with no signal (2026-10-10..10-24); fail as loudly as the crawl.
    needs: [build, deploy]
    # A timeout cancels the job: always() plus the results catches it where failure() would not.
    # Only the default branch may deploy to Pages, so a branch run's refusal is not an outage.
    if: ${{ always() && github.ref_name == github.event.repository.default_branch && (needs.build.result != 'success' || needs.deploy.result != 'success') }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Report the failure on the open P1 issue, or open one
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          OPEN=$(gh issue list --state open --search 'in:title "P1: deploy failed"' --json number --jq '.[0].number // empty' || true)
          # A new issue notifies only watchers; the @mention reaches the owner every time and, unlike
          # an assignment, cannot make filing fail.
          if [ -n "$OPEN" ]; then
            gh issue comment "$OPEN" --body "@$GITHUB_REPOSITORY_OWNER failed again on $(date -u +%Y-%m-%d). Run: $RUN_URL"
          else
            gh issue create \
              --title "P1: deploy failed" \
              --body "@$GITHUB_REPOSITORY_OWNER the Pages deploy failed, so the live site is frozen at its last good build. Run: $RUN_URL"
          fi
